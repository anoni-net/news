name: deploy

# main 更新時建置兩份產物，推到 build 分支的 clearnet/ 與 onion/。伺服器拉 build 分支上線。
# build 分支保留歷史，出問題時可以退回上一個 commit。
#
# 排程發布：date 還沒到的文章先不產出（見 SPEC.md「排程發布」），重建之後時間到的文章才會出現。
# 午夜的那一批由 m6 的 crontab 在台北時間 00:03、00:13、00:23 用 workflow_dispatch 觸發
# （tools/m6-dispatch.sh）。GitHub 的 schedule 名義上每小時一輪，2026-09-27 到 10-01 實際
# 4 到 8 小時才執行一次，留著當備援，接住 pin 到期這類不必準時的變化。
# 產物沒變時不推，m6 那一側也就沒有東西要拉。

on:
  push:
    branches: [main]
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # 圖片與網站圖示的快取。檔名不會重複使用（內文圖片依序編號、網站圖示帶內容雜湊），
      # 快取裡的檔案不會過期。m6 暫時連不上時，已經抓過的檔案照樣建置得出來，每小時的
      # 排程發布不會因此停擺。build.py 從快取讀出來之後照樣檢查格式、metadata 與大小。
      # PR 的 check 不用快取，每次都從 assets.anoni.net 重新抓，確認檔案真的在圖片主機上
      - uses: actions/cache@v4
        with:
          path: .cache/assets
          key: assets-${{ hashFiles('favicons.toml', 'posts/**/*.md') }}
          restore-keys: assets-

      # 標題字型的原始檔（約 40 MB），build.py 下載後會比對 sha256。版本固定，key 跟著
      # build.py 的 FONT_BASE_URL 換。子集化很快，只快取原始檔，見 SPEC.md「標題字型」
      - uses: actions/cache@v4
        with:
          path: |
            .cache/fonts/SubsetOTF
            .cache/fonts/LICENSE
          key: fonts-noto-serif-cjk-2.003

      - name: build.py --check
        run: uv run build.py --check

      - name: 推到 build 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin build:build 2>/dev/null; then
            git worktree add ../out build
          else
            git worktree add --orphan -b build ../out
          fi
          rsync -a --delete --exclude .git public/ ../out/
          cd ../out
          git add -A
          if git diff --cached --quiet; then
            echo "產物沒有變動"
            exit 0
          fi
          git commit -q -m "build: ${GITHUB_SHA} (${GITHUB_EVENT_NAME})"
          git push origin build

  # 新文章上線後發到 Bluesky 的 @news.anoni.net，規則見 SPEC.md「Bluesky」。
  # 獨立成一個 job，失敗不影響網站上線。已經發過的文章每一輪都會略過，
  # 還沒上線的等下一輪。BLUESKY_APP_PASSWORD 沒設時工具直接略過
  bluesky:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 發文到 Bluesky
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: uv run tools/bluesky_post.py
