[project]
name = "anoni-net-news"
version = "0.1.0"
description = "anoni.net/news 新聞導讀的靜態網站產生器"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "pyyaml>=6.0",
    "websockets>=13",
    "pillow>=10",
    "fonttools>=4.50",
    "brotli>=1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
