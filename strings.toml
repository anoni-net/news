# 介面文字，三個語系的鍵必須一致，少一個就建置失敗。規則見 SPEC.md「多語系」。
# 大括號是 str.format 的欄位，由 build.py 填入。連結前後的文字拆成 _before 與 _after，
# 模板把連結夾在中間，不在這裡寫 HTML。newsletter 用在頁首與頁尾的連結，newsletter_inline 用在
# 文章末尾那一句話裡，英文的大小寫不同。newsletter_url 是訂閱表單，中文與英文各有一份。
# 頁面上的 RSS 連結指向同語系的訂閱頁 subscribe/，不寫在這裡。規則見 SPEC.md「RSS」。
# about 是頁尾到關於頁的連結，report 與 report_url 是回報錯誤的連結，三個語系都指向 GitHub 的 issue 表單。

