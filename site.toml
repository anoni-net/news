# 三個輸出目標的差異。模板裡的連結一律寫 clearnet 的網址，onion 與 ipfs 產物由
# rewrites 在 HTML 產生之後改寫 href。規則見 SPEC.md「clearnet 與 onion」與「IPFS 鏡像」。

onion_host = "anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion"
per_page = 20
feed_items = 20

# 頁首與頁尾用到的外部入口，一律寫 clearnet 的網址
homepage = "https://anoni.net/"

# 新文章上線時自動發文的 Bluesky 帳號，規則見 SPEC.md「Bluesky」。
# 登入用的 app password 放在 GitHub secret BLUESKY_APP_PASSWORD，不寫在這裡
[bluesky]
handle = "news.anoni.net"

[targets.clearnet]
out = "public/clearnet"
# 完整網址的前綴，用在 canonical、RSS、sitemap、Open Graph 與 JSON-LD
base_url = "https://anoni.net/news/"
# 站內連結的前綴，從根目錄起算、不寫網域
prefix = "/news/"
clearnet = true
rewrites = []
# 文章頁的朗讀按鈕，只用裝置本機的語音。onion 不放，Tor Browser 也關掉了語音 API。
# 規則見 SPEC.md「朗讀按鈕」
read_aloud = true
# 標題的自架字型，建置時只取用到的字。onion 不放，Tor Browser 最高安全等級本來就停用網頁字型。
# 規則見 SPEC.md「標題字型」
fonts = true

# 流量統計，只放 clearnet，onion 不載入。規則見 SPEC.md「流量統計」。
# website_id 是 aa.anoni.net 上的 anoni-net-news，跟文件站的網站分開。
# domains 讓本機預覽與 CI 的版面檢查不送出資料。
[targets.clearnet.analytics]
src = "https://aa.anoni.net/script.js"
website_id = "3790f14b-870c-4c29-83eb-dbb2977c65a9"
domains = "anoni.net"

[targets.onion]
out = "public/onion"
base_url = "http://news.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/"
prefix = "/"
clearnet = false
# 由上往下比對，第一條比對到的就套用。news 與 docs 要排在官網那條前面。
rewrites = [
    ["https://anoni.net/news/", "http://news.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/"],
    ["https://anoni.net/docs/", "http://docs.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/"],
    ["https://form.anoni.net/", "http://form.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/"],
    ["https://anoni.net/", "http://anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/"],
]

# anoni.net 的 IPFS 鏡像（toomore/anoni-net-ws#422），整個網站掛在閘道的根目錄，本站在 /news/。
# 鏡像是備援，canonical、hreflang、og、JSON-LD、RSS 與 sitemap 都維持 clearnet 的完整網址，
# 只改寫 <body> 裡的連結（links_only）。朗讀按鈕與標題字型照樣放，不載入流量統計。
[targets.ipfs]
out = "public/ipfs"
base_url = "https://anoni.net/news/"
prefix = "/news/"
clearnet = true
links_only = true
read_aloud = true
fonts = true
# 由上往下比對，第一條比對到的就套用。改寫成原樣的規則保留那個網址：
# Gears 與 API 不在鏡像裡，連結維持 clearnet
rewrites = [
    ["https://anoni.net/gears", "https://anoni.net/gears"],
    ["https://anoni.net/api", "https://anoni.net/api"],
    ["https://anoni.net/", "/"],
]
